apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigee-api-operator
  namespace: apigee-api-operator-system
  labels:
    app: apigee-api-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigee-api-operator
  template:
    metadata:
      labels:
        app: apigee-api-operator
    spec:
      serviceAccountName: apigee-api-operator
      # ─────────────────────────────────────────────────────────────────────
      # Authentication:
      #
      #   kind / non-GKE: hack/setup-auth.sh creates the 'apigee-sa-key'
      #     secret from your ADC or a service account key.
      #     GOOGLE_APPLICATION_CREDENTIALS points the Go ADC library to it.
      #
      #   GKE (Workload Identity): hack/setup-auth.sh annotates the K8s SA
      #     to impersonate the GCP SA — no secret needed. The volume mount
      #     is optional: true so the pod starts fine without the secret.
      # ─────────────────────────────────────────────────────────────────────
      containers:
        - name: operator
          image: apigee-api-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - -v=2
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/secrets/google
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
      volumes:
        - name: gcp-credentials
          secret:
            # Created by: make setup-auth PROJECT=<your-project>
            # On GKE with Workload Identity this secret is not needed —
            # optional: true means the pod still starts fine.
            secretName: apigee-sa-key
            optional: true
