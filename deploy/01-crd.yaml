apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apigeeapis.apigee.example.com
spec:
  group: apigee.example.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - organization
                - environment
                - basePath
                - targetUrl
              properties:
                organization:
                  type: string
                  description: "Apigee organization (GCP project for Apigee X)"
                environment:
                  type: string
                  description: "Apigee environment to deploy to (eval, dev, prod)"
                proxyName:
                  type: string
                  description: "Optional proxy name (defaults to CR name)"
                basePath:
                  type: string
                  description: "URL path prefix for the API (e.g. /hello)"
                  pattern: "^/.*"
                targetUrl:
                  type: string
                  description: "Backend URL the proxy routes to"
                  pattern: "^https?://.*"
                description:
                  type: string
                  description: "Optional description for the API proxy"
                policies:
                  type: array
                  description: "Ordered list of Apigee policies. Run in ProxyEndpoint PreFlow Request after StripBasePath."
                  items:
                    type: object
                    required: ["type"]
                    properties:
                      type:
                        type: string
                        description: "Policy type"
                        enum: [Quota, SpikeArrest, VerifyAPIKey, CORS, OAuthV2]
                      name:
                        type: string
                        description: "Policy instance name (defaults to {Type}-{index})"
                      config:
                        type: object
                        description: "Policy-specific key-value config. See docs for keys per type."
                        additionalProperties:
                          type: string
            status:
              type: object
              properties:
                proxyRevision:
                  type: integer
                deployed:
                  type: boolean
                publicUrl:
                  type: string
                message:
                  type: string
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Deploying
                    - Ready
                    - Error
                    - Deleting
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The metadata.generation that was last successfully reconciled"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Org
          type: string
          jsonPath: .spec.organization
        - name: Env
          type: string
          jsonPath: .spec.environment
        - name: BasePath
          type: string
          jsonPath: .spec.basePath
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Revision
          type: integer
          jsonPath: .status.proxyRevision
        - name: Deployed
          type: boolean
          jsonPath: .status.deployed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  names:
    kind: ApigeeAPI
    plural: apigeeapis
    singular: apigeeapi
    shortNames:
      - aapi
    categories:
      - all
  scope: Namespaced
