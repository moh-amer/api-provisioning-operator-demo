# Example: Secured API proxy with VerifyAPIKey + SpikeArrest policies
#
# VerifyAPIKey: rejects requests without a valid API key in ?apikey=<key>
# SpikeArrest:  limits throughput after key is verified (10 req/sec)
#
# Note: VerifyAPIKey requires the key to belong to a Developer App
# that has access to an API Product referencing this proxy.
# For a quick demo, any key from a Developer App in the same org will work.
#
# Usage:
#   kubectl apply -f deploy/examples/secured-api.yaml
#   kubectl get aapi secured-api -w
#
#   # Without key → 401 Unauthorized:
#   curl https://YOUR_APIGEE_HOSTNAME/secure/get
#
#   # With valid key → 200:
#   curl "https://YOUR_APIGEE_HOSTNAME/secure/get?apikey=YOUR_VALID_KEY"
#
apiVersion: apigee.example.com/v1alpha1
kind: ApigeeAPI
metadata:
  name: secured-api
  namespace: default
spec:
  organization: "project-710238f0-9aba-4085-903"
  environment: "eval"
  basePath: "/secure"
  targetUrl: "https://httpbin.org"
  description: "Key-secured API — VerifyAPIKey + SpikeArrest demo"
  policies:
    - type: VerifyAPIKey
      config:
        apiKeyLocation: "queryparam"   # read key from ?apikey=xxx
        apiKeyName: "apikey"
    - type: SpikeArrest
      config:
        rate: "10ps"                   # 10 requests per second after auth
