# Act 6 -- "The Empire" (Fleet API 3/3)
# Notification service with daily quota
apiVersion: apigee.example.com/v1alpha1
kind: ApigeeAPI
metadata:
  name: notifications-api
  namespace: default
spec:
  organization: "project-710238f0-9aba-4085-903"
  environment: "eval"
  basePath: "/notifications"
  targetUrl: "https://httpbin.org"
  description: "Notifications API -- push notification service with daily quota"
  policies:
    - type: Quota
      config:
        allow: "5000"
        interval: "1"
        timeUnit: "day"
