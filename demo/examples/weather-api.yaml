# The protagonist: a simple weather API
# Act 1 -- "The Birth"
# No policies, just a clean proxy to wttr.in
apiVersion: apigee.example.com/v1alpha1
kind: ApigeeAPI
metadata:
  name: weather-api
  namespace: default
spec:
  organization: "project-710238f0-9aba-4085-903"
  environment: "eval"
  basePath: "/weather"
  targetUrl: "https://wttr.in"
  description: "Weather Forecast API -- live weather data from wttr.in"
